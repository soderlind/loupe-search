name: Manually Build release zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string
        default: ''

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build plugin
        run: composer install --no-dev --optimize-autoloader

      - name: Scope bundled dependencies (Strauss)
        run: bash bin/strauss.sh

      - name: Verify scoped autoload
        run: |
          php -r '
            require "vendor/autoload.php";
            require "vendor-prefixed/autoload.php";
            $loupe = "Soderlind\\Plugin\\LoupeSearch\\Vendor\\Loupe\\Loupe\\Loupe";
            $iv = "Soderlind\\Plugin\\LoupeSearch\\Vendor\\Composer\\InstalledVersions";
            if (!class_exists($loupe)) { fwrite(STDERR, "FAIL: missing $loupe\n"); exit(1); }
            $v = $iv::getVersion("nitotm/efficient-language-detector");
            if (!$v) { fwrite(STDERR, "FAIL: ELD not registered in scoped metadata\n"); exit(1); }
            echo "Scoped autoload OK: Loupe + ELD $v\n";
          '

      - name: Stage release files
        run: |
          mkdir -p /tmp/loupe-search
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude-from='.distignore' \
            . /tmp/loupe-search/

      - name: Archive Release
        working-directory: /tmp
        run: zip -r ${{ github.workspace }}/loupe-search.zip loupe-search/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" loupe-search.zip --clobber
          else
            gh release create "$TAG" loupe-search.zip --title "$TAG" --generate-notes
          fi
