name: Manually Build release zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string
        default: ''

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build plugin
        run: composer install --no-dev --optimize-autoloader

      - name: Stage release files
        run: |
          mkdir -p /tmp/loupe-search
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude-from='.distignore' \
            . /tmp/loupe-search/

      - name: Archive Release
        working-directory: /tmp
        run: zip -r ${{ github.workspace }}/loupe-search.zip loupe-search/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" loupe-search.zip --clobber
          else
            gh release create "$TAG" loupe-search.zip --title "$TAG" --generate-notes
          fi
