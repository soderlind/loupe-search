name: Plugin asset/readme update

on:
  push:
    branches:
      - main

jobs:
  trunk:
    name: Push to trunk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: loupe-search
          # Only readme.txt and assets belong in this workflow. Without this the
          # action rsyncs the workspace over trunk/ with --delete, and since this
          # job never runs `composer install` that wipes trunk/vendor.
          IGNORE_OTHER_FILES: true
