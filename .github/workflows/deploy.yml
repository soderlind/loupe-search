name: Deploy to WordPress.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Scope bundled dependencies (Strauss)
        run: bash bin/strauss.sh

      - name: Verify scoped autoload
        run: |
          php -r '
            require "vendor/autoload.php";
            require "vendor-prefixed/autoload.php";
            $loupe = "Soderlind\\Plugin\\LoupeSearch\\Vendor\\Loupe\\Loupe\\Loupe";
            $iv = "Soderlind\\Plugin\\LoupeSearch\\Vendor\\Composer\\InstalledVersions";
            if (!class_exists($loupe)) { fwrite(STDERR, "FAIL: missing $loupe\n"); exit(1); }
            $v = $iv::getVersion("nitotm/efficient-language-detector");
            if (!$v) { fwrite(STDERR, "FAIL: ELD not registered in scoped metadata\n"); exit(1); }
            echo "Scoped autoload OK: Loupe + ELD $v\n";
          '

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: loupe-search
